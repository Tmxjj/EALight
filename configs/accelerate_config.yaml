compute_environment: LOCAL_MACHINE
distributed_type: DEEPSPEED
downcast_bf16: 'no'
gpu_ids: all
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 4
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
deepspeed_config:
  deepspeed_multinode_launcher: standard
  gradient_accumulation_steps: 4
  zero3_init_flag: false
  # overlap_comm/reduce_bucket_size 等 zero_optimization 子字段在 accelerate 简化 YAML
  # 中无法透传，必须使用外部 JSON 才能生效；完整配置见 ds_config_lora.json
  hf_ds_config: configs/ds_config_lora.json